<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>采集协作流程</title><style>body{margin:0;background:#f4f8fb;color:#172434;font:16px system-ui;padding:28px}main{max-width:900px;margin:auto}.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.box{background:white;border:1px solid #c9d9e5;border-radius:16px;padding:18px}.note{margin-top:18px;background:#fff7df;border:1px solid #ebc96b;border-radius:16px;padding:18px}@media(max-width:760px){.flow{grid-template-columns:1fr}}</style><main><h1>管理员、参与者与系统协作流程</h1><div class="flow"><section class="box"><b>1 管理员</b><p>准备并发布</p></section><section class="box"><b>2 参与者</b><p>理解并准备</p></section><section class="box"><b>3 参与者</b><p>建立会话并录制</p></section><section class="box"><b>4 系统</b><p>上传与核验</p></section><section class="box"><b>5 管理员</b><p>复核并收口</p></section></div><section class="note"><b>异常支路</b><p>延期、纠正、拒绝或要求重录；原记录与处置原因始终保留。</p></section></main></html>
