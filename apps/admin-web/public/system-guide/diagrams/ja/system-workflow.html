<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>収集の協力フロー</title><style>body{margin:0;background:#f4f8fb;color:#172434;font:16px system-ui;padding:28px}main{max-width:900px;margin:auto}.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.box{background:white;border:1px solid #c9d9e5;border-radius:16px;padding:18px}.note{margin-top:18px;background:#fff7df;border:1px solid #ebc96b;border-radius:16px;padding:18px}@media(max-width:760px){.flow{grid-template-columns:1fr}}</style><main><h1>管理者、参加者、システムの協力フロー</h1><div class="flow"><section class="box"><b>1 管理者</b><p>準備して公開</p></section><section class="box"><b>2 参加者</b><p>理解して準備</p></section><section class="box"><b>3 参加者</b><p>セッション作成と録画</p></section><section class="box"><b>4 システム</b><p>送信と検証</p></section><section class="box"><b>5 管理者</b><p>審査して完了</p></section></div><section class="note"><b>例外経路</b><p>延長、修正、拒否、再撮影を選び、元の記録と判断理由を保持します。</p></section></main></html>
